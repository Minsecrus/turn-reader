[package]
name = "turn"
version = "0.2.0"
description = "注重用户体验的极简 EPUB 阅读器"
license = "MIT"
repository = "https://github.com/Minsecrus/turn-reader"
edition = "2021"

[lib]
name = "turn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

# Reads the content:// URIs that the Android file picker and "Open with" hand over.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-fs = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
