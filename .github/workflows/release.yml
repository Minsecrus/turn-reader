name: Release

# Push a tag like v0.2.0 to build the Windows installer and the Android APK and
# create a draft release with both. The tag must match "version" in
# src-tauri/tauri.conf.json.
#
# Android: the APK is signed with the key in the ANDROID_KEYSTORE_BASE64 (the
# .jks file, base64) and ANDROID_KEYSTORE_PASSWORD (store and key password,
# alias "turn") secrets. Every release must use the same key, or installed
# copies can't be updated.
#
# Windows: the installer is signed through SignPath (free code signing for open
# source) once these are set in the repository settings:
#   secret   SIGNPATH_API_TOKEN
#   variable SIGNPATH_ORGANIZATION_ID
#   variable SIGNPATH_PROJECT_SLUG
#   variable SIGNPATH_SIGNING_POLICY_SLUG
# Without them the installer is released unsigned.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        name: Check the tag against the app version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the app version $version (tauri.conf.json)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npx tauri build

      - uses: actions/upload-artifact@v4
        id: unsigned
        with:
          name: windows-unsigned
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # SignPath signs the artifact uploaded above (it checks that it was built
      # by this workflow) and hands back the signed installer.
      - name: Sign the installer (SignPath)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Pick the installer to release
        shell: bash
        run: |
          mkdir out
          if [ -d signed ]; then
            find signed -name '*.exe' -exec cp {} out/ \;
            [ -n "$(ls out)" ] || { echo "::error::SignPath returned no .exe"; exit 1; }
            echo "Releasing the signed installer."
          else
            cp src-tauri/target/release/bundle/nsis/*.exe out/
            echo "::warning::SignPath isn't configured; releasing the installer unsigned."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*.exe
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: dtolnay/rust-toolchain@stable
        with:
          # 64-bit and 32-bit ARM: every phone that can run Turn.
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - run: npm ci

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets are missing; an unsigned APK can't be installed."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/turn-release.jks"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/turn-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=turn
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Build APK
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android build --apk --target aarch64 armv7
          mkdir out
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
            "out/Turn_${{ needs.version.outputs.version }}_android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk
          if-no-files-found: error

  release:
    needs: [version, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '{windows,android}'
          merge-multiple: true
          path: files

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          ls -l files
          gh release create "$TAG" files/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --draft \
            --title "Turn $TAG" \
            --notes "$(printf '%s\n' \
              '- **Windows**：下载 `.exe` 安装包，双击安装。' \
              '- **Android**：下载 `.apk`，在手机上打开安装（首次需要允许“安装未知应用”）。')"
