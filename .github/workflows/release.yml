name: Release

# Push a tag like v0.1.0 to build the Windows installer and create a draft release.
# The tag should match "version" in src-tauri/tauri.conf.json.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Call the CLI directly so the build doesn't depend on package.json scripts.
          tauriScript: npx tauri
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Turn ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: 下载 `.exe` 安装包，双击安装即可。
          releaseDraft: true
          prerelease: false

      # Keep the installer as a run artifact too, so it can be downloaded from
      # the run page even if creating the release fails.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Turn-windows-x64-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
